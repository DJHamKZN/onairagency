  Основной блок не трогаем: этот слой сам находит элементы и «оживляет» их.

<style>

.oa-tilt.in { transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .8s ease, border-color .3s !important; }

  /* ================= ЗВЁЗДНОЕ НЕБО ================= */
  function stars() {
    if (!CFG.stars) return;
    var old = doc.getElementById('bg-canvas');
    if (old) {
      // старая анимация продолжает «считать», но больше ничего не рисует — и не тратит видеокарту
      try {
        var octx = old.getContext('2d'), noop = function () {};
        ['clearRect', 'fillRect', 'stroke', 'fill', 'beginPath', 'moveTo', 'lineTo', 'arc'].forEach(function (m) { octx[m] = noop; });
        octx.createRadialGradient = function () { return { addColorStop: noop }; };
      } catch (e) {}
      old.style.display = 'none';
    }
    var cv = doc.createElement('canvas');
    cv.id = 'oa-stars'; cv.setAttribute('aria-hidden', 'true');
    if (old && old.parentNode) old.parentNode.insertBefore(cv, old.nextSibling); else body.insertBefore(cv, body.firstChild);
    var ctx = cv.getContext('2d');
    var W = 0, H = 0, dpr = 1, nodes = [], sparks = [], waves = [];

    var sprite = (function () {
      var s = doc.createElement('canvas'); s.width = s.height = 64;
      var g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, 'rgba(255,215,225,1)');
      gr.addColorStop(0.16, 'rgba(255,90,125,.95)');
      gr.addColorStop(0.42, 'rgba(225,29,72,.28)');
      gr.addColorStop(1, 'rgba(225,29,72,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
      return s;
    })();

    function build() {
      var n = Math.round(clamp(W * H / (FINE ? 12500 : 20000), 36, 130));
      nodes = [];
      for (var i = 0; i < n; i++) {
        var z = 0.3 + Math.random() * 0.7, a = Math.random() * Math.PI * 2, sp = (3 + Math.random() * 8) * z;
        nodes.push({ x: Math.random() * W, y: Math.random() * H, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          z: z, s: 0.5 + (0.6 + Math.random() * 1.6) * z, tw: Math.random() * 6.3, ox: 0, oy: 0, rx: 0, ry: 0, glow: 0 });
      }
    }
    var lastW = 0, lastH = 0;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // на телефоне высота «прыгает» из-за адресной строки — не пересоздаём звёзды без нужды
      if (Math.abs(W - lastW) > 40 || Math.abs(H - lastH) > 160 || !nodes.length) build();
      lastW = W; lastH = H;
    }
    addEventListener('resize', resize); resize();

    // шлейф из звёзд за мышкой
    var lx = -1, ly = -1;
    addEventListener('pointermove', function (e) {
      if (e.pointerType !== 'mouse' || REDUCE) return;
      if (lx < 0) { lx = e.clientX; ly = e.clientY; return; }
      var dx = e.clientX - lx, dy = e.clientY - ly, dist = Math.sqrt(dx * dx + dy * dy);
      var n = Math.min(4, Math.floor(dist / 14));
      for (var i = 0; i < n && sparks.length < 160; i++) {
        var t = (i + 1) / n;
        sparks.push({ x: lx + dx * t, y: ly + dy * t, vx: (Math.random() - 0.5) * 40 - dx * 0.4, vy: (Math.random() - 0.5) * 40 - dy * 0.4 + 10,
          life: 0, max: 0.6 + Math.random() * 0.8, s: 1.6 + Math.random() * 2.8, rot: Math.random() * 3 });
      }
      if (n) { lx = e.clientX; ly = e.clientY; }
    }, { passive: true });
    // волна по клику / тапу
    addEventListener('pointerdown', function (e) {
      if (REDUCE || (e.target.closest && e.target.closest('.t-popup,.t972,input,textarea'))) return;
      waves.push({ x: e.clientX, y: e.clientY, r: 0, life: 0 });
      if (waves.length > 4) waves.shift();
    }, { passive: true });

    function drawStar(x, y, r, rot) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
      for (var i = 0; i < 4; i++) {
        ctx.lineTo(0, -r); ctx.rotate(Math.PI / 4); ctx.lineTo(0, -r * 0.28); ctx.rotate(Math.PI / 4);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }

    var R = 190, TH = 145, M = 40;
    function frame(dt, now) {
      var t = now / 1000, mx = ptr.x, my = ptr.y, mOn = ptr.active && FINE, sy = scroll.y;
      ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      var i, j, p, q, dx, dy, d2, d;

      for (i = 0; i < waves.length; i++) { waves[i].life += dt; waves[i].r += dt * 720; }
      waves = waves.filter(function (w) { return w.life < 1.1; });

      for (i = 0; i < nodes.length; i++) {
        p = nodes[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.x < -M) p.x = W + M; else if (p.x > W + M) p.x = -M;
        if (p.y < -M) p.y = H + M; else if (p.y > H + M) p.y = -M;
        // глубина: при прокрутке дальние звёзды двигаются медленнее ближних
        var by = ((p.y - sy * 0.14 * p.z) % (H + 2 * M) + (H + 2 * M)) % (H + 2 * M) - M;
        var bx = p.x, tx = 0, ty = 0, g = 0;
        if (mOn) {
          dx = mx - bx; dy = my - by; d2 = dx * dx + dy * dy;
          if (d2 < R * R) { d = Math.sqrt(d2); var f = 1 - d / R; tx = dx * f * 0.32 * p.z; ty = dy * f * 0.32 * p.z; g = f; }
        }
        for (j = 0; j < waves.length; j++) {
          var w = waves[j]; dx = bx - w.x; dy = by - w.y; d = Math.sqrt(dx * dx + dy * dy) || 1;
          var band = 1 - Math.abs(d - w.r) / 90;
          if (band > 0) { var k = band * (1 - w.life / 1.1) * 60; tx += dx / d * k; ty += dy / d * k; g = Math.max(g, band); }
        }
        p.ox = lerp(p.ox, tx, 0.09); p.oy = lerp(p.oy, ty, 0.09);
        p.glow = lerp(p.glow, g, 0.1);
        p.rx = bx + p.ox; p.ry = by + p.oy;
      }

      // паутина между звёздами
      ctx.lineWidth = 1;
      for (i = 0; i < nodes.length; i++) {
        p = nodes[i];
        for (j = i + 1; j < nodes.length; j++) {
          q = nodes[j]; dx = p.rx - q.rx; dy = p.ry - q.ry; d2 = dx * dx + dy * dy;
          if (d2 < TH * TH) {
            var al = (1 - Math.sqrt(d2) / TH) * 0.2 * Math.min(p.z, q.z) * (1 + (p.glow + q.glow) * 1.6);
            ctx.strokeStyle = 'rgba(225,29,72,' + al.toFixed(3) + ')';
            ctx.beginPath(); ctx.moveTo(p.rx, p.ry); ctx.lineTo(q.rx, q.ry); ctx.stroke();
          }
        }
      }
      // нити от курсора к ближайшим звёздам
      if (mOn) {
        for (i = 0; i < nodes.length; i++) {
          p = nodes[i]; dx = p.rx - mx; dy = p.ry - my; d2 = dx * dx + dy * dy;
          if (d2 < R * R) {
            ctx.strokeStyle = 'rgba(255,95,130,' + ((1 - Math.sqrt(d2) / R) * 0.55).toFixed(3) + ')';
            ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(p.rx, p.ry); ctx.stroke();
          }
        }
      }
      // сами звёзды
      for (i = 0; i < nodes.length; i++) {
        p = nodes[i];
        var tw = 0.65 + 0.35 * Math.sin(t * 0.9 + p.tw);
        var h = p.s * (4.2 + p.glow * 4);
        ctx.globalAlpha = clamp((0.45 + 0.55 * p.z) * tw + p.glow * 0.6, 0, 1);
        ctx.drawImage(sprite, p.rx - h, p.ry - h, h * 2, h * 2);
      }
      ctx.globalAlpha = 1;
      // волны
      for (i = 0; i < waves.length; i++) {
        var wv = waves[i];
        ctx.strokeStyle = 'rgba(255,80,115,' + (0.45 * (1 - wv.life / 1.1)).toFixed(3) + ')';
        ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(wv.x, wv.y, wv.r, 0, Math.PI * 2); ctx.stroke();
      }
      // шлейф
      for (i = sparks.length - 1; i >= 0; i--) {
        var s = sparks[i]; s.life += dt;
        if (s.life >= s.max) { sparks.splice(i, 1); continue; }
        s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.94; s.vy = s.vy * 0.94 + 18 * dt; s.rot += dt * 2;
        var lf = 1 - s.life / s.max;
        ctx.globalAlpha = lf;
        ctx.drawImage(sprite, s.x - s.s * 3.2, s.y - s.s * 3.2, s.s * 6.4, s.s * 6.4);
        ctx.fillStyle = 'rgba(255,' + Math.round(160 + 95 * lf) + ',' + Math.round(180 + 75 * lf) + ',1)';
        drawStar(s.x, s.y, s.s * (0.6 + lf), s.rot);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    if (REDUCE) { frame(0, 0); return; }
    onTick(frame);
  }

  /* ================= СФЕРА НА ПЕРВОМ ЭКРАНЕ ================= */
  function globe() {
    var hero = doc.getElementById('hero');
    if (!CFG.globe || !hero || !FINE || innerWidth < 1024) return;
    var cv = doc.createElement('canvas');
    cv.className = 'oa-globe'; cv.setAttribute('aria-hidden', 'true');
    hero.insertBefore(cv, hero.firstChild.nextSibling);
    var ctx = cv.getContext('2d'), S = 0, dpr = 1;
    function size() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      S = cv.clientWidth || 520;
      cv.width = cv.height = Math.round(S * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener('resize', size); size();
    var N = 820, pts = [], golden = Math.PI * (3 - Math.sqrt(5));
    for (var i = 0; i < N; i++) {
      var y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = golden * i;
      pts.push([Math.cos(th) * r, y, Math.sin(th) * r]);
    }
    var rotY = 0, tiltX = -0.35, tiltT = -0.35, spin = 0, inView = true;
    if ('IntersectionObserver' in window) new IntersectionObserver(function (e) { inView = e[0].isIntersecting; }).observe(hero);
    setTimeout(function () { cv.classList.add('is-ready'); }, 60);

    function proj(x, y, z) {
      // поворот вокруг Y, затем наклон вокруг X
      var cy = Math.cos(rotY), syy = Math.sin(rotY), cx = Math.cos(tiltX), sx = Math.sin(tiltX);
      var x1 = x * cy - z * syy, z1 = x * syy + z * cy;
      var y1 = y * cx - z1 * sx, z2 = y * sx + z1 * cx;
      var R = S * 0.36, f = 2.6 / (2.6 - z2);
      return [S / 2 + x1 * R * f, S / 2 + y1 * R * f, z2, f];
    }
    onTick(function (dt, now) {
      if (!inView || !S) return;
      var t = now / 1000;
      var mx = (ptr.x / innerWidth - 0.5), my = (ptr.y / innerHeight - 0.5);
      spin = lerp(spin, ptr.active ? mx * 0.9 : 0, 0.03);
      rotY += dt * (0.16 + spin);
      tiltT = -0.35 + (ptr.active ? my * 0.5 : 0);
      tiltX = lerp(tiltX, tiltT, 0.04);
      ctx.clearRect(0, 0, S, S);
      // мягкое свечение позади сферы
      var gr = ctx.createRadialGradient(S / 2, S / 2, S * 0.05, S / 2, S / 2, S * 0.5);
      gr.addColorStop(0, 'rgba(225,29,72,.16)'); gr.addColorStop(1, 'rgba(225,29,72,0)');
      ctx.fillStyle = gr; ctx.fillRect(0, 0, S, S);
      // точки
      for (var i = 0; i < N; i++) {
        var p = pts[i], q = proj(p[0], p[1], p[2]);
        var front = (q[2] + 1) / 2;
        var a = 0.07 + front * front * 0.85;
        var sz = (0.6 + front * 1.5) * q[3];
        ctx.fillStyle = front > 0.55 ? 'rgba(255,' + Math.round(70 + 110 * (front - 0.55)) + ',' + Math.round(100 + 100 * (front - 0.55)) + ',' + a.toFixed(3) + ')' : 'rgba(225,29,72,' + a.toFixed(3) + ')';
        ctx.fillRect(q[0] - sz / 2, q[1] - sz / 2, sz, sz);
      }
      // орбиты со «спутниками» — сигнал в эфире
      for (var k = 0; k < 2; k++) {
        var inc = k ? 1.05 : -0.55, rad = k ? 1.32 : 1.18, sp = k ? 0.55 : -0.38;
        ctx.beginPath();
        for (var s = 0; s <= 96; s++) {
          var ang = s / 96 * Math.PI * 2;
          var ox = Math.cos(ang) * rad, oz = Math.sin(ang) * rad;
          var oy = oz * Math.sin(inc); oz = oz * Math.cos(inc);
          var o = proj(ox, oy, oz);
          if (s) ctx.lineTo(o[0], o[1]); else ctx.moveTo(o[0], o[1]);
        }
        ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1; ctx.stroke();
        var sa = t * sp + k * 2;
        var sx2 = Math.cos(sa) * rad, sz2 = Math.sin(sa) * rad;
        var sat = proj(sx2, sz2 * Math.sin(inc), sz2 * Math.cos(inc));
        var sf = (sat[2] + 1.4) / 2.8;
        ctx.globalAlpha = clamp(sf, 0.15, 1);
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sat[0], sat[1], 2.2 * sat[3], 0, Math.PI * 2); ctx.fill();
        // расходящиеся «радиоволны» от спутника
        var ph = (t * 0.8 + k * 0.5) % 1;
        ctx.strokeStyle = 'rgba(255,80,115,' + ((1 - ph) * 0.6).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(sat[0], sat[1], 4 + ph * 26, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    });
  }

  /* ================= ПЕРВЫЙ ЭКРАН: свечение за мышкой + параллакс ================= */
  function heroFx() {
    var hero = doc.getElementById('hero');
    if (!hero) return;
    var au = doc.createElement('div');
    au.className = 'oa-aurora'; au.setAttribute('aria-hidden', 'true');
    au.innerHTML = '<i></i>';
    hero.insertBefore(au, hero.firstChild);
    var blob = au.firstChild, bx = innerWidth * 0.3, by = innerHeight * 0.45;
    var content = hero.querySelector('.max-w-7xl');
    onTick(function (dt, now) {
      var t = now / 1000, r = hero.getBoundingClientRect();
      if (r.bottom < 0) return;
      var tx, ty;
      if (ptr.active && FINE) { tx = ptr.x - r.left; ty = ptr.y - r.top; }
      else { tx = r.width * (0.35 + 0.18 * Math.sin(t * 0.35)); ty = r.height * (0.42 + 0.12 * Math.cos(t * 0.27)); }
      bx = lerp(bx, tx, 0.05); by = lerp(by, ty, 0.05);
      blob.style.transform = 'translate3d(' + bx.toFixed(1) + 'px,' + by.toFixed(1) + 'px,0)';
      if (content && !REDUCE) {
        var k = clamp(-r.top / (r.height || 1), 0, 1);
        content.style.transform = 'translate3d(0,' + (k * 120).toFixed(1) + 'px,0)';
        content.style.opacity = (1 - k * 1.1).toFixed(3);
      }
    });
  }

  /* ================= БЕГУЩАЯ СТРОКА ================= */
  function marquee() {
    var hero = doc.getElementById('hero');
    if (!CFG.marquee || !hero) return;
    var words = ['Performance-маркетинг', 'Сквозная аналитика', 'ИИ и нейросети', 'Яндекс Директ', 'VK Реклама', 'SMM', 'ROMI', 'Стратегия', 'Креатив'];
    var star = '<svg class="oa-mq__star" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c.6 6.4 5.6 11.4 12 12-6.4.6-11.4 5.6-12 12-.6-6.4-5.6-11.4-12-12C6.4 11.4 11.4 6.4 12 0z"/></svg>';
    var grp = words.map(function (w) { return '<span class="oa-mq__it">' + w + '</span>' + star; }).join('');
    function row(cls) { return '<div class="oa-mq ' + cls + '"><div class="oa-mq__track"><div class="oa-mq__grp">' + grp + '</div><div class="oa-mq__grp">' + grp + '</div><div class="oa-mq__grp">' + grp + '</div></div></div>'; }
    var sec = doc.createElement('section');
    sec.className = 'oa-mq-sec'; sec.setAttribute('aria-hidden', 'true');
    sec.innerHTML = row('oa-mq--a') + row('oa-mq--b');
    hero.parentNode.insertBefore(sec, hero.nextSibling);
    var rows = $$('.oa-mq__track', sec).map(function (tr, i) { return { tr: tr, x: 0, dir: i ? 1 : -1, w: 0 }; });
    function measure() { rows.forEach(function (r) { r.w = r.tr.firstChild.getBoundingClientRect().width; if (r.dir > 0) r.x = -r.w; }); }
    measure();
    if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(measure);
    addEventListener('resize', measure);
    var inView = true;
    if ('IntersectionObserver' in window) new IntersectionObserver(function (e) { inView = e[0].isIntersecting; }).observe(sec);
    if (REDUCE) return;
    onTick(function (dt) {
      if (!inView) return;
      var boost = clamp(Math.abs(scroll.v) * 9, 0, 900);
      rows.forEach(function (r) {
        if (!r.w) return;
        r.x += r.dir * scroll.dir * (55 + boost) * dt;
        if (r.x <= -r.w * 2) r.x += r.w;
        if (r.x > 0) r.x -= r.w;
        r.tr.style.transform = 'translate3d(' + r.x.toFixed(1) + 'px,0,0)';
      });
    });
  }

  /* ================= ЗАГОЛОВКИ ПО СЛОВАМ ================= */
  function splitWords(el) {
    var n = 0;
    (function walk(node, grad) {
      Array.prototype.slice.call(node.childNodes).forEach(function (ch) {
        if (ch.nodeType === 3) {
          if (!ch.textContent.trim()) { if (ch.textContent.length) ch.textContent = ' '; return; }
          var frag = doc.createDocumentFragment();
          ch.textContent.split(/(\s+)/).forEach(function (part) {
            if (!part) return;
            if (/^\s+$/.test(part)) { frag.appendChild(doc.createTextNode(' ')); return; }
            var w = doc.createElement('span'); w.className = 'oa-w';
            var inner = doc.createElement('span'); inner.className = 'oa-wi' + (grad ? ' oa-grad' : '');
            inner.style.transitionDelay = (n++ * 0.065).toFixed(3) + 's';
            inner.textContent = part; w.appendChild(inner); frag.appendChild(w);
          });
          ch.parentNode.replaceChild(frag, ch);
        } else if (ch.nodeType === 1 && ch.tagName !== 'BR') {
          var g = grad || ch.classList.contains('text-gradient-neon');
          if (ch.classList.contains('text-gradient-neon')) ch.classList.add('oa-grad-host');
          walk(ch, g);
        }
      });
    })(el, false);
  }
  var heroTitle = null;
  function headings() {
    if (!CFG.headings || BOT) return;
    var hs = $$('#hero h1, #about h2, #services h2, #cases h2, #audit-form h2, .oa-faq h2');
    hs.forEach(function (h) {
      h.setAttribute('aria-label', h.textContent.replace(/\s+/g, ' ').trim());
      splitWords(h);
      $$('.oa-w', h).forEach(function (w) { w.setAttribute('aria-hidden', 'true'); });
      h.classList.add('oa-split');
      h.classList.remove('reveal');
    });
    heroTitle = $('#hero h1.oa-split');
    splitHeadings = hs;
  }
  var splitHeadings = [];
  function revealHeadings() {
    if (heroTitle) setTimeout(function () { heroTitle.classList.add('oa-in'); }, 120);
    whenVisible(splitHeadings.filter(function (h) { return h !== heroTitle; }), function (h) { h.classList.add('oa-in'); }, 0.25);
  }

  /* ================= «РАСШИФРОВКА» ПОДПИСЕЙ ================= */
  function scrambleNode(node) {
    var final = node.textContent, chars = '!<>-_/[]{}=+*^?#01ABCDEFXZ', t0 = performance.now(), D = 900;
    (function step(now) {
      var p = clamp((now - t0) / D, 0, 1), out = '';
      for (var i = 0; i < final.length; i++) {
        var c = final[i];
        out += (c === ' ' || c === '/' || i / final.length < p * 1.15 - 0.15) ? c : chars[(Math.random() * chars.length) | 0];
      }
      node.textContent = out;
      if (p < 1) requestAnimationFrame(step); else node.textContent = final;
    })(t0);
  }
  function scramble() {
    if (!CFG.scramble || REDUCE || BOT) return;
    var labels = $$('section p.font-mono, .oa-faq__tag, #hero .reveal.font-mono').filter(function (el) {
      return /\/\/|АГЕНТСТВО/.test(el.textContent);
    });
    whenVisible(labels, function (el) {
      var tw = doc.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false), list = [], n;
      while ((n = tw.nextNode())) if (n.textContent.trim()) list.push(n);
      setTimeout(function () { list.forEach(scrambleNode); }, 150);
    }, 0.6);
  }

  /* ================= ЦИФРЫ НАБЕГАЮТ ================= */
  function counters() {
    if (!CFG.counters || REDUCE || BOT) return;
    var els = $$('#hero div.font-black, #cases-stack .text-gradient-neon').filter(function (el) {
      return !el.children.length && /\d/.test(el.textContent);
    });
    els.forEach(function (el) {
      el.classList.add('oa-num');
      el._oaFinal = el.textContent;
      el.textContent = el._oaFinal.replace(/\d+/g, '0');
    });
    countersReady = function () {
      whenVisible(els, function (el) {
        var parts = el._oaFinal.split(/(\d+)/), t0 = performance.now(), D = 1700 + Math.random() * 400;
        var delay = el.closest('#hero') ? 350 : 120;
        setTimeout(function () {
          t0 = performance.now();
          (function step(now) {
            var p = clamp((now - t0) / D, 0, 1), e = p === 1 ? 1 : 1 - Math.pow(2, -10 * p);
            el.textContent = parts.map(function (s, i) { return i % 2 ? String(Math.round(parseInt(s, 10) * e)) : s; }).join('');
            if (p < 1) requestAnimationFrame(step); else el.textContent = el._oaFinal;
          })(t0);
        }, delay);
      }, 0.5);
    };
  }
  var countersReady = function () {};

  /* ================= ПОДСВЕТКА, НАКЛОН, МАГНИТ ================= */
  function spotlight() {
    if (!CFG.spotlight || !FINE) return;
    $$('.glass-panel, .glass-panel-heavy, .glass-panel-neon, #cases-stack .case-card, #services-grid > article').forEach(function (el) { el.classList.add('oa-spot'); });
    doc.addEventListener('pointermove', function (e) {
      var el = e.target.closest && e.target.closest('.oa-spot');
      if (!el) return;
      var r = el.getBoundingClientRect();
      el.style.setProperty('--mx', (e.clientX - r.left).toFixed(0) + 'px');
      el.style.setProperty('--my', (e.clientY - r.top).toFixed(0) + 'px');
    }, { passive: true });
  }
  function tilt() {
    if (!CFG.tilt || !FINE || REDUCE) return;
    var els = $$('#about .reveal.glass-panel, #audit-form .glass-panel-heavy');
    els.forEach(function (el) {
      var max = el.classList.contains('glass-panel-heavy') ? 3 : 5;
      el.classList.add('oa-tilt');
      el.addEventListener('pointermove', function (e) {
        if (e.pointerType !== 'mouse') return;
        var r = el.getBoundingClientRect(), px = (e.clientX - r.left) / r.width - 0.5, py = (e.clientY - r.top) / r.height - 0.5;
        el.style.transform = 'perspective(1100px) rotateX(' + (-py * max).toFixed(2) + 'deg) rotateY(' + (px * max).toFixed(2) + 'deg)';
      });
      el.addEventListener('pointerleave', function () { el.style.transform = ''; });
    });
  }
  function magnetic() {
    if (!CFG.magnetic || !FINE || REDUCE) return;
    var els = $$('#hero button[data-scroll], #main-header a[href="#audit"], #audit-form a[href^="#"], #main-header nav button');
    var items = els.map(function (el) {
      var it = { el: el, x: 0, y: 0, tx: 0, ty: 0, k: el.closest('nav') ? 0.25 : 0.35 };
      el.addEventListener('pointermove', function (e) {
        var r = el.getBoundingClientRect();
        it.tx = (e.clientX - (r.left + r.width / 2)) * it.k; it.ty = (e.clientY - (r.top + r.height / 2)) * it.k;
      });
      el.addEventListener('pointerleave', function () { it.tx = 0; it.ty = 0; });
      return it;
    });
    onTick(function () {
      items.forEach(function (it) {
        it.x = lerp(it.x, it.tx, 0.18); it.y = lerp(it.y, it.ty, 0.18);
        if (Math.abs(it.x) < 0.05 && Math.abs(it.y) < 0.05 && !it.tx && !it.ty) { if (it.el.style.translate) it.el.style.translate = ''; return; }
        it.el.style.translate = it.x.toFixed(2) + 'px ' + it.y.toFixed(2) + 'px';
      });
    });
    $$('#main-header a[href="#audit"], #audit-form a[href^="#"]').forEach(function (el) { el.classList.add('oa-shine'); });
  }

  /* ================= УСЛУГИ: СТОПКА КАРТОЧЕК ================= */
  function stack() {
    var grid = doc.getElementById('services-grid');
    if (!CFG.stack || !grid || REDUCE) return;
    var cards = $$('#services-grid > article');
    if (cards.length < 2) return;
    var mq = matchMedia('(min-width: 1024px)');
    cards.forEach(function (c, i) {
      c.style.setProperty('--i', i);
      var dim = doc.createElement('div'); dim.className = 'oa-dim'; c.appendChild(dim); c._oaDim = dim;
    });
    function apply() {
      var on = mq.matches;
      grid.classList.toggle('oa-stack', on);
      cards.forEach(function (c) {
        if (on) { c.classList.remove('reveal'); c.classList.add('in'); }
        else { c.style.transform = ''; c._oaDim.style.opacity = 0; }
      });
    }
    apply();
    if (mq.addEventListener) mq.addEventListener('change', apply); else if (mq.addListener) mq.addListener(apply);
    var inView = false;
    if ('IntersectionObserver' in window) new IntersectionObserver(function (e) { inView = e[0].isIntersecting; }).observe(grid);
    onTick(function () {
      if (!inView || !grid.classList.contains('oa-stack')) return;
      for (var i = 0; i < cards.length; i++) {
        var c = cards[i], p = 0;
        if (i < cards.length - 1) {
          var a = c.getBoundingClientRect().top, b = cards[i + 1].getBoundingClientRect().top;
          p = clamp(1 - (b - a) / (c.offsetHeight || 1), 0, 1);
        }
        c.style.transform = p ? 'scale(' + (1 - p * 0.06).toFixed(4) + ')' : '';
        c._oaDim.style.opacity = (p * 0.55).toFixed(3);
      }
    });
  }

  /* ================= КЕЙСЫ: подпись курсора ================= */
  function casesFx() {
    $$('#cases-stack .case-card').forEach(function (card) {
      var head = card.querySelector('.case-header'), drawer = card.querySelector('.case-drawer');
      if (!head || !drawer) return;
      function sync() {
        $$('#cases-stack .case-card').forEach(function (c) {
          var h = c.querySelector('.case-header'), d = c.querySelector('.case-drawer');
          if (h && d) h.setAttribute('data-cursor', d.style.display === 'block' ? 'Свернуть' : 'Открыть');
        });
      }
      head.addEventListener('click', function () { setTimeout(sync, 0); });
      sync();
    });
  }

  /* ================= ШАПКА, ПРОГРЕСС, ЗЕРНО ================= */
  function chrome() {
    if (CFG.grain) { var g = doc.createElement('div'); g.className = 'oa-grain'; g.setAttribute('aria-hidden', 'true'); body.appendChild(g); }
    var bar = null;
    if (CFG.progress) { bar = doc.createElement('div'); bar.className = 'oa-progress'; bar.setAttribute('aria-hidden', 'true'); body.appendChild(bar); }
    var header = doc.getElementById('main-header'), drawer = doc.getElementById('mobile-navigation-drawer'), hidden = false, acc = 0;
    onTick(function () {
      if (bar) {
        var max = Math.max(1, root.scrollHeight - innerHeight);
        bar.style.transform = 'scaleX(' + clamp(scroll.y / max, 0, 1).toFixed(4) + ')';
      }
      if (CFG.smartHeader && header) {
        var menuOpen = drawer && !drawer.classList.contains('hidden');
        acc = clamp(acc + scroll.v, -60, 60);
        var hide = hidden;
        if (menuOpen || scroll.y < 600 || acc < -20) hide = false;
        else if (acc > 30) hide = true;
        if (hide !== hidden) { hidden = hide; header.style.translate = hide ? '0 -110%' : ''; }
      }
    });
  }

  /* ================= СТАРТ ================= */
  onReady(function () {
    safe('smoothScroll', smoothScroll);
    safe('stars', stars);
    safe('heroFx', heroFx);
    safe('globe', globe);
    safe('marquee', marquee);
    safe('headings', headings);
    safe('counters', counters);
    safe('spotlight', spotlight);
    safe('tilt', tilt);
    safe('magnetic', magnetic);
    safe('stack', stack);
    safe('casesFx', casesFx);
    safe('cursor', cursor);
    safe('chrome', chrome);
    requestAnimationFrame(loop);
    // заголовки, подписи и цифры на первом экране запускаются уже после заставки
    preloader(function () {
      safe('revealHeadings', revealHeadings);
      safe('scramble', scramble);
      safe('countersReady', function () { countersReady(); });
    });
  });
})();
</script>
